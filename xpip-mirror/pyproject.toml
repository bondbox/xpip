[build-system]
build-backend = "hatchling.build"
requires = [
    "hatch-requirements-txt",
    "hatchling",
]

[project]
authors = [
    { name = "Mingzhe Zou", email = "zoumingzhe@outlook.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
description = "pip mirror management"
dynamic = [
    "dependencies",
    "version",
]
keywords = [
    "pip",
    "pypi",
    "mirror",
]
name = "xpip-mirror"
requires-python = ">=3.8"

[project.license]
file = "LICENSE"

[project.readme]
content-type = "text/markdown"
file = "readme.md"

[project.scripts]
xpip-mirror = "xpip_mirror.cmds:main"

[project.urls]
Homepage = "https://github.com/bondbox/xpip/"

[tool.hatch.build.targets.sdist]
exclude = [
    "xpip_mirror/unittest",
]
packages = [
    "xpip_mirror",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "xpip_mirror/unittest",
]
packages = [
    "xpip_mirror",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",
]

[tool.hatch.version]
path = "xpip_mirror/attribute.py"
